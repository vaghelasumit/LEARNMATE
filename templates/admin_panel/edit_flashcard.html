{% extends 'base.html' %}

{% block title %}Edit Flashcard - Admin{% endblock %}

{% block content %}
<div class="container py-3">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="custom-card p-4">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4 class="fw-bold mb-0">Edit Flashcard</h4>
                    <a href="{% url 'admin_subject_flashcards' card.subject.subject_id %}" class="btn btn-outline-secondary btn-sm">Cancel</a>
                </div>

                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Subject</label>
                        {{ form.subject }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Question / Concept (Front)</label>
                        {{ form.question }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Answer / Explanation (Back)</label>
                        {{ form.answer }}
                    </div>
                    <button type="submit" class="btn btn-primary w-100 fw-semibold">
                        Update Flashcard
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
